[project]
name = "embodied-arxiv-daily"
version = "0.1.0"
description = "Local arXiv paper workspace for embodied intelligence and robotics papers."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "jinja2>=3.1",
  "markupsafe>=2.0",
  "openai>=1.40",
  "Pillow>=10.0",
  "pypdf>=5.0",
  "pypdfium2>=4.30",
  "python-multipart>=0.0.9",
  "sqlmodel>=0.0.21",
  "typer>=0.12",
  "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
arxiv-daily = "arxiv_daily.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["arxiv_daily*"]

[tool.setuptools.package-data]
arxiv_daily = [
  "templates/*.html",
  "static/*.css",
  "static/*.js",
  "static/*.svg",
]
