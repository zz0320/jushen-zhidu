<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}具身智读{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/logo.svg') }}?v=20260520-resume-summary-jobs">
    <link rel="shortcut icon" href="{{ url_for('static', path='/logo.svg') }}?v=20260520-resume-summary-jobs">
    <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v=20260526-nav-pill">
    {% block extra_head %}{% endblock %}
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <script src="{{ url_for('static', path='/app.js') }}?v=20260527-forest-v40" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要内容</a>
    <header class="topbar">
      <a class="brand" href="/">
        <img class="brand-mark" src="{{ url_for('static', path='/logo.svg') }}?v=20260520-resume-summary-jobs" alt="">
        <span>具身智读</span>
      </a>
      {% set current_path = request.url.path %}
      <nav class="main-nav app-main-nav" aria-label="主导航">
        <a class="{{ 'is-active' if current_path == '/' else '' }}" href="/">总览</a>
        <a class="{{ 'is-active' if current_path.startswith('/papers') else '' }}" href="/papers">单篇论文</a>
        <a class="{{ 'is-active' if current_path.startswith('/forest') else '' }}" href="/forest">论文森林</a>
        <a class="{{ 'is-active' if current_path.startswith('/keywords') else '' }}" href="/keywords">扫描规则</a>
        <a class="{{ 'is-active' if current_path.startswith('/settings') else '' }}" href="/settings">智能设置</a>
      </nav>
    </header>
    <main class="shell" id="main-content">
      {% if message %}
        <div class="notice">{{ message }}</div>
      {% endif %}
      {% if error %}
        <div class="notice notice-error">{{ error }}</div>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
    <footer class="app-footer">
      <span>Thank you to arXiv for use of its open access interoperability.</span>
    </footer>
  </body>
</html>
