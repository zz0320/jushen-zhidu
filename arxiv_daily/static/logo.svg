<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">具身智读 logo</title>
  <desc id="desc">A deep blue research reader mark with an open paper, scan orbit, and intelligent signal dot.</desc>
  <defs>
    <linearGradient id="mark-bg" x1="14" y1="10" x2="84" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D2A44"/>
      <stop offset=".58" stop-color="#087EA4"/>
      <stop offset="1" stop-color="#182033"/>
    </linearGradient>
    <linearGradient id="paper-left" x1="24" y1="31" x2="49" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E7F7FB"/>
    </linearGradient>
    <linearGradient id="paper-right" x1="49" y1="31" x2="73" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#DDEAF5"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#081526" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="80" height="80" rx="22" fill="url(#mark-bg)"/>
  <path d="M21 29c12-8 43-11 58 1" fill="none" stroke="#86D7F0" stroke-width="4" stroke-linecap="round" opacity=".62"/>
  <path d="M17 69c16 12 48 12 64 0" fill="none" stroke="#FF7A5C" stroke-width="4" stroke-linecap="round"/>

  <g filter="url(#soft-shadow)">
    <path d="M24 35c9-4 18-3 25 3v34c-7-6-16-8-25-4V35z" fill="url(#paper-left)"/>
    <path d="M49 38c7-6 16-7 25-3v33c-9-4-18-2-25 4V38z" fill="url(#paper-right)"/>
    <path d="M49 38v34" fill="none" stroke="#1D2A44" stroke-width="3" stroke-linecap="round" opacity=".86"/>
  </g>

  <path d="M30 44c5-1 10 0 14 3M30 53c5-1 10 0 14 3M55 47c4-2 8-3 13-2M55 56c4-2 8-3 13-2" fill="none" stroke="#087EA4" stroke-width="3" stroke-linecap="round" opacity=".78"/>
  <circle cx="49" cy="24" r="8" fill="#FF7A5C"/>
  <circle cx="49" cy="24" r="3.2" fill="#FFF0EC"/>
  <path d="M32 27c7-6 27-9 38 0" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity=".82"/>
</svg>
